logging.level.root=INFO

#spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:3306}/${SPRING_DATASOURCE_NAME:db_football_updater}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:springuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#spring.jpa.show-sql: true

endpoint.secret=${ENDPOINT_SECRET}

dashboard.password=${DASHBOARD_PASSWORD}

# Data source configs
datasource.priority=${DATASOURCE_PRIORITY}

# Post configs
ig.post.version=${IG_POST_VERSION:2}
ig.post.accountName=${IG_POST_ACCOUNT_NAME:Instagram}
ig.post.defaultHashtags=${IG_POST_DEFAULT_HASHTAGS:}

# Image generator configs
image.generator.enabled=${IMAGE_GENERATOR_ENABLED:true}
image.generator.inputPath=${IMAGE_GENERATOR_INPUT_PATH:/input}
image.generator.outputPath=${IMAGE_GENERATOR_OUTPUT_PATH:./src/main/resources/images/output}
image.generator.externalImageStoreUri=${IMAGE_GENERATOR_EXTERNAL_IMAGE_STORE_URI:www.s3bucket.com}
image.generator.genericBaseImageFile=${IMAGE_GENERATOR_GENERIC_BASE_IMAGE_FILE:Generic_base_player_stat_image.jpg}
image.generator.summaryBaseImageFile=${IMAGE_GENERATOR_SUMMARY_BASE_IMAGE_FILE:/base-images/summary_base_image.jpg}

mailer.enabled=${MAILER_IS_ENABLED:true}
mailer.subject=${MAILER_SUBJECT:Latest Football Updates}
mailer.from.name=${MAILER_FROM_NAME:Football Updater}
mailer.from.address=${MAILER_FROM_ADDRESS}
mailer.from.password=${MAILER_FROM_PASSWORD}
mailer.to.name=${MAILER_TO_NAME:You}
mailer.to.address=${MAILER_TO_ADDRESS}
mailer.attachImages=${MAILER_IS_ATTACH_IMAGES:false}

# AWS credential configs
aws.s3.enabled=${AWS_S3_IS_ENABLED:true}
aws.s3.accessKey=${AWS_ACCESS_KEY:access key}
aws.s3.secretKey=${AWS_SECRET_KEY:secret key}
aws.s3.bucketName=${AWS_S3_BUCKET_NAME:football-updater-bucket}
aws.s3.objectKeyPrefix=${AWS_S3_OBJECT_KEY_PREFIX}
aws.s3.environment=${AWS_S3_ENVIRONMENT:dev}

# Facebook API configs
facebook.api.clientId=${FACEBOOK_API_CLIENT_ID}
facebook.api.clientSecret=${FACEBOOK_API_CLIENT_SECRET}
facebook.api.responseType=${FACEBOOK_API_RESPONSE_TYPE}
facebook.api.scope=${FACEBOOK_API_SCOPE}
facebook.api.redirectUri=${FACEBOOK_API_REDIRECT_URI}
facebook.api.instagram.userId=${FACEBOOK_API_INSTAGRAM_USER_ID}
facebook.api.tokenRefreshThresholdDays=${FACEBOOK_API_TOKEN_REFRESH_THRESHOLD_DAYS:10}

# Tiktok API configs
tiktok.api.clientKey=${TIKTOK_API_CLIENT_KEY}
tiktok.api.clientSecret=${TIKTOK_API_CLIENT_SECRET}
tiktok.api.scope=${TIKTOK_API_SCOPE}
tiktok.api.redirectUri=${TIKTOK_API_REDIRECT_URI}
tiktok.api.privacyLevel=${TIKTOK_API_PRIVACY_LEVEL}

# Team
team.nameSuffixesToRemove=${TEAM_NAME_SUFFIXES_TO_REMOVE}

# Phone review links in the update email (signed, single-use). Off unless both are set; the secret needs 32+ characters
review-link.baseUrl=${REVIEW_LINK_BASE_URL:}
review-link.secret=${REVIEW_LINK_SECRET:}
review-link.expiryHours=${REVIEW_LINK_EXPIRY_HOURS:48}

# LLM editor and caption agents (Anthropic). When disabled, rule-based highlights and template captions are used
llm.enabled=${LLM_ENABLED:false}
llm.apiKey=${ANTHROPIC_API_KEY:}
llm.model=${LLM_MODEL:claude-sonnet-5-5}
llm.maxPostsPerRun=${LLM_MAX_POSTS_PER_RUN:10}
llm.captionExamplesLocation=${LLM_CAPTION_EXAMPLES_LOCATION:classpath:llm/caption-examples.txt}
llm.visionModel=${LLM_VISION_MODEL:claude-opus-5-5}

# Standout photo pipeline. Sources in priority order (NONE, MANUAL_URL), matcher (NOOP, FACE_SIDECAR), framer (CENTER, VISION)
photo.sources=${PHOTO_SOURCES:NONE}
photo.matcher=${PHOTO_MATCHER:NOOP}
photo.framer=${PHOTO_FRAMER:CENTER}
photo.maxDownloadBytes=${PHOTO_MAX_DOWNLOAD_BYTES:10485760}
photo.downloadTimeoutSeconds=${PHOTO_DOWNLOAD_TIMEOUT_SECONDS:10}
# Face matcher sidecar (photo.matcher=FACE_SIDECAR). Similarities are ArcFace cosine; tune on past posts
photo.face.sidecarUrl=${FACE_SIDECAR_URL:http://localhost:8001}
photo.face.model=${FACE_MODEL_PACK:buffalo_l}
photo.face.connectTimeoutMillis=${FACE_SIDECAR_CONNECT_TIMEOUT_MILLIS:2000}
photo.face.readTimeoutMillis=${FACE_SIDECAR_READ_TIMEOUT_MILLIS:15000}
photo.face.minSimilarity=${FACE_MIN_SIMILARITY:0.30}
photo.face.confidentSimilarity=${FACE_CONFIDENT_SIMILARITY:0.45}
photo.face.minReferences=${FACE_MIN_REFERENCES:3}
photo.face.maxReferences=${FACE_MAX_REFERENCES:5}
photo.face.crossCheckEnabled=${FACE_CROSS_CHECK_ENABLED:true}

# Scheduler configs - Spring cron format (second minute hour day month weekday), "-" disables a job
scheduler.zone=${SCHEDULER_ZONE:UTC}
scheduler.playerUpdate.cron=${SCHEDULER_PLAYER_UPDATE_CRON:-}
scheduler.tokenRefresh.cron=${SCHEDULER_TOKEN_REFRESH_CRON:0 0 * * * *}
spring.task.scheduling.pool.size=${SCHEDULER_POOL_SIZE:2}
